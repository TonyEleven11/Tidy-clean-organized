<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tidy, Clean, Organized</title>

<!-- PWA / iPhone home-screen support -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tidy" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="app-header">
  <h1>Tidy, Clean, Organized</h1>
  <p class="app-sub">Most overdue first</p>
</header>

<main>
  <ul id="task-list" class="task-list"></ul>
  <p id="empty-state" class="empty-state" hidden>No tasks yet. Tap the + button to add your first one.</p>
</main>

<button id="add-task-btn" class="fab" type="button" aria-label="Add task">+</button>

<div id="toast" class="toast"></div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Add task</h2>
    <form id="modal-form">
      <label class="modal-label" for="modal-name">Task name</label>
      <input id="modal-name" class="modal-input" type="text" autocomplete="off" maxlength="60" />

      <div id="modal-interval-field">
        <label class="modal-label" for="modal-days">Repeat every how many days?</label>
        <input id="modal-days" class="modal-input" type="number" inputmode="numeric" min="1" step="1" />
      </div>

      <p id="modal-annual-note" class="modal-note" hidden></p>
      <p id="modal-error" class="modal-error"></p>

      <div class="modal-actions">
        <button id="modal-delete" class="modal-btn danger" type="button" hidden>Delete</button>
        <div class="modal-actions-right">
          <button id="modal-cancel" class="modal-btn" type="button">Cancel</button>
          <button id="modal-save" class="modal-btn primary" type="submit">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>

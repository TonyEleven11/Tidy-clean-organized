<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tidy, Clean, Organized</title>

<!-- PWA / iPhone home-screen support -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#fff7ed" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tidy" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>

<!-- TODAY TAB (default / main tab): only what needs doing today -->
<section id="view-today" class="view">
  <header id="today-header" class="today-header"></header>
  <div id="today-banner" class="today-banner"></div>
  <main class="view-main">
    <ul id="today-list" class="task-list today-list"></ul>
    <p id="today-empty" class="empty-state" hidden></p>
  </main>
</section>

<!-- ALL TASKS TAB: the complete list, with frequency + last done -->
<section id="view-all" class="view" hidden>
  <header class="all-header">
    <div class="all-header-text">
      <h1>✨ All Tasks</h1>
      <p class="app-sub">Your home, your way 💗</p>
    </div>
    <button id="add-task-btn" class="add-btn" type="button" aria-label="Add task">+</button>
  </header>
  <main class="view-main">
    <div class="all-table">
      <div class="all-table-head" aria-hidden="true">
        <span class="col-task">TASK</span>
        <span class="col-freq">FREQ.</span>
        <span class="col-last">LAST DONE</span>
        <span class="col-chevron"></span>
      </div>
      <ul id="all-list" class="all-list"></ul>
    </div>
    <p id="all-empty" class="empty-state" hidden>No tasks yet. Tap + to add your first one.</p>
  </main>
</section>

<!-- Bottom tab bar -->
<nav class="tab-bar">
  <button id="tab-today-btn" class="tab-btn active" type="button">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.5 12 4l9 7.5" />
      <path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9" />
      <path d="M9.5 20v-6h5v6" />
    </svg>
    <span class="tab-label">Today</span>
  </button>
  <button id="tab-all-btn" class="tab-btn" type="button">
    <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="4.5" width="4" height="4" rx="1" />
      <rect x="3.5" y="15.5" width="4" height="4" rx="1" />
      <path d="M10.5 6.5h10M10.5 17.5h10" />
    </svg>
    <span class="tab-label">All Tasks</span>
  </button>
</nav>

<div id="toast" class="toast"></div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title">Add task</h2>
    <form id="modal-form">
      <label class="modal-label" for="modal-name">Task name</label>
      <input id="modal-name" class="modal-input" type="text" autocomplete="off" maxlength="60" />

      <div id="modal-interval-field">
        <label class="modal-label" for="modal-days">Repeat every how many days?</label>
        <input id="modal-days" class="modal-input" type="number" inputmode="numeric" min="1" step="1" />
      </div>

      <p id="modal-annual-note" class="modal-note" hidden></p>
      <p id="modal-error" class="modal-error"></p>

      <div class="modal-actions">
        <button id="modal-delete" class="modal-btn danger" type="button" hidden>Delete</button>
        <div class="modal-actions-right">
          <button id="modal-mark-done" class="modal-btn" type="button" hidden>Mark done today</button>
          <button id="modal-cancel" class="modal-btn" type="button">Cancel</button>
          <button id="modal-save" class="modal-btn primary" type="submit">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script src="app.js?v=10"></script>
</body>
</html>
